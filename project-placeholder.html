<!DOCTYPE html> 
<html lang="es" data-theme="dark"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Humberto Ferrer</title> 
    <!-- FAVICON / LOGO PESTAÑA NAVEGADOR --> 
    <link rel="icon" type="image/png" href="PIC_Logo.png"> 
    <link rel="shortcut icon" href="PIC_Logo.png" type="image/x-icon"> 
    <link rel="stylesheet" href="style.css"> 
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet"> 
    <style> 
        .project-detail-hero { 
            padding: 8.5rem 15% 4rem; 
            text-align: left; 
        } 
        .project-media-wrapper { 
            width: 100%; 
            max-width: 100%;  
            aspect-ratio: 16/9; 
            background-color: var(--card-bg); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 12px; 
            margin: 2rem 0 3rem 0; 
            font-size: 1.5rem; 
            color: var(--text-muted); 
            font-weight: bold; 
            overflow: hidden; 
            border: 2px solid transparent; 
            transition: all 0.3s ease; 
            cursor: zoom-in; 
        } 
        .project-media-wrapper:hover { 
            border-color: var(--accent); 
            box-shadow: 0 0 25px rgba(229, 185, 26, 0.4); 
        } 
                 
        .sendokai-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 1.5rem; 
            margin-top: 2rem; 
            margin-bottom: 3rem; 
        } 
        .sendokai-card { 
            width: 100%; 
            aspect-ratio: 16/9; 
            border-radius: 12px; 
            overflow: hidden; 
            background-color: var(--card-bg); 
            border: 2px solid transparent; 
            transition: all 0.3s ease; 
            cursor: zoom-in; 
        } 
        .sendokai-card:hover { 
            border-color: var(--accent); 
            box-shadow: 0 0 20px rgba(229, 185, 26, 0.4); 
            transform: scale(1.02); 
        } 
        .sendokai-card img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        } 
        .back-btn { 
            display: inline-block; 
            margin-top: 3rem; 
            color: var(--accent); 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 1.1rem; 
        } 
        .back-btn:hover { text-decoration: underline; } 
        @media screen and (max-width: 768px), screen and (orientation: portrait) { 
            .project-detail-hero { 
                padding: 7rem 5% 3rem !important; 
            } 
        } 
    </style> 
</head> 
<body id="project-detail-page"> 
    <div id="lightbox" onclick="closeLightbox()"> 
        <img id="lightbox-img" src="" alt="Pantalla Completa"> 
    </div> 
    <div id="copy-tooltip">Copiado</div> 
    <div id="nav-container"></div> 
    <div class="project-detail-hero"> 
        <p class="section-subtitle reveal" id="project-subtitle">— PROJECT SHOWCASE</p> 
        <h1 id="project-title" class="accent glow-text reveal">Cargando Proyecto...</h1> 
                 
        <div id="project-tags" class="project-roles reveal" style="margin-top: 1.2rem;"></div> 
        <hr class="divider reveal" id="project-divider" style="margin: 2.5rem 0; width: 100%;"> 
                 
        <div id="project-desc-wrapper" class="reveal" style="margin-bottom: 2rem;"> 
            <p id="project-desc" style="font-size: 1.15rem; color: var(--text-main); line-height: 1.8; max-width: 100%;"></p> 
        </div> 
        <div class="project-media-wrapper reveal" id="project-media"> 
            [ Espacio para el vídeo o las imágenes de este proyecto ] 
        </div> 
        <div id="project-extra-content" class="reveal"></div> 
                 
        <div id="related-sections" style="margin-top: 4rem;"></div> 
                 
        <a href="https://humbertoferrerbernal.github.io/" class="back-btn reveal">&larr; Volver al Portfolio</a> 
    </div> 
    <div id="footer-container"></div> 
    <script src="script.js"></script> 
</body> 
</html>
